workflows:
  unsigned-ipa:
    name: Saturn unsigned IPA
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Generate app icons
        script: |
          node scripts/generate-icons.mjs

      - name: Build the web app
        script: |
          npm run build

      - name: Sync web assets and plugins
        script: |
          npx cap sync ios

      - name: Build an unsigned IPA
        script: |
          mkdir -p dist build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive -archivePath build/Saturn.xcarchive
          APP=build/Saturn.xcarchive/Products/Applications/App.app
          codesign -f -s - --timestamp=none "$APP/PlugIns/SaturnWidget.appex" || true
          codesign -f -s - --timestamp=none "$APP/Frameworks/Capacitor.framework" || true
          codesign -f -s - --timestamp=none "$APP/Frameworks/Cordova.framework" || true
          codesign -f -s - --timestamp=none "$APP"
          mkdir -p build/Payload
          cp -r "$APP" build/Payload/Saturn.app
          cd build
          zip -r ../dist/Saturn.ipa Payload

    artifacts:
      - dist/Saturn.ipa
      - /tmp/xcodebuild_logs/*.log