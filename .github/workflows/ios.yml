name: Build unsigned iOS app

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run icons

      - name: Build the web app
        run: npm run build

      - name: Add the iOS project
        run: npx cap add ios

      - name: Copy web assets into the app
        run: npx cap sync ios

      - name: Build an unsigned IPA
        run: |
          mkdir -p dist
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive -archivePath build/Saturn.xcarchive
          mkdir -p build/Payload
          cp -r build/Saturn.xcarchive/Products/Applications/App.app build/Payload/Saturn.app
          cd build
          zip -r ../dist/Saturn.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Saturn-unsigned-ipa
          path: dist/Saturn.ipa
          if-no-files-found: error
          retention-days: 30